services:
  - type: web
    name: broadcastos
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn BroadcastOs.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: broadcastos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"

databases:
  - name: broadcastos-db
    databaseName: broadcastos
    user: broadcastos_user

